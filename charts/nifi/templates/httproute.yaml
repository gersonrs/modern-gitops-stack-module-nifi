{{- $httproute := (.Values.httproute | default dict) }}
{{- if ($httproute.enabled | default false) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nifi
spec:
  parentRefs:
    - name: {{ $httproute.gateway_name | default "istio-gateway" }}
      namespace: {{ $httproute.gateway_namespace | default "istio-ingress" }}
      sectionName: https
  hostnames:
    - {{ $httproute.host | quote }}
  rules:
    - matches:
        {{- range ($httproute.paths | default (list ($httproute.path | default "/nifi"))) }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: driver-ip
          port: 8080
{{- end }}
